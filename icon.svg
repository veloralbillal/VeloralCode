<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="pwa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="pwa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#pwa-bg)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Code Toolkit Core Shield & Code Brackets -->
  <g filter="url(#pwa-glow)">
    <!-- Central Hexagonal Tech Base -->
    <path d="M256 96 L384 168 V312 L256 384 L128 312 V168 Z" fill="#0f172a" fill-opacity="0.6" stroke="url(#pwa-accent)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Code Bracket Left: < -->
    <path d="M208 208 L168 248 L208 288" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Code Bracket Right: > -->
    <path d="M304 208 L344 248 L304 288" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash: / -->
    <path d="M272 192 L240 304" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />

    <!-- Tool Sparkle / Dot Accent -->
    <circle cx="256" cy="144" r="8" fill="#38bdf8" />
    <circle cx="256" cy="352" r="8" fill="#a855f7" />
  </g>
</svg>
