<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeToolkit - Developer Code & Tool Platform</title>
    <meta name="description" content="Production-ready code sharing and developer toolkit platform with Firebase Realtime Database." />
    <meta property="og:title" content="CodeToolkit - Developer Code & Tool Platform" />
    <meta property="og:description" content="Production-ready code sharing and developer toolkit platform with Firebase Realtime Database." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #090d16; color: #f8fafc;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p id="loading-text" style="margin-top: 18px; font-size: 14px; font-weight: 500; color: #94a3b8; letter-spacing: 0.5px;">Loading CodeToolkit...</p>
        <div id="loading-fallback-actions" style="display: none; margin-top: 16px; text-align: center;">
          <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px;">Taking longer than usual to connect...</p>
          <button onclick="window.location.reload()" style="padding: 7px 16px; background: #6366f1; color: #ffffff; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);">
            Tap to Reload
          </button>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
        <script>
          // Show reload helper if app bundle doesn't mount within 3 seconds
          setTimeout(function() {
            var fb = document.getElementById('loading-fallback-actions');
            if (fb && document.getElementById('loading-text')) {
              fb.style.display = 'block';
            }
          }, 3000);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
